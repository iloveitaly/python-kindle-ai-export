[project]
name = "python-kindle-ai-export"
version = "0.1.0"
description = "Export Kindle books to Markdown, PDF, and audiobooks using Camoufox and Pydantic-AI"
keywords = ["kindle", "pydantic-ai", "camoufox", "audiobook"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "camoufox>=0.5.6",
    "click>=8.5.0",
    "funcy>=2.1",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.43.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "structlog-config>=0.15.0",
    "whenever>=0.10.5",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/python-kindle-ai-export" }


# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license
[project.scripts]
python-kindle-ai-export = "python_kindle_ai_export:main"


[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2",
    "pytest-asyncio>=1.4.0",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["python_kindle_ai_export"]

[tool.coverage.report]
fail_under = 50
